<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mes tâches - TP API temps réel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

</head>

<body>
    <header>
        <h1 class="animate__animated animate__bounceInLeft"><a class="brand" href="#">ToDo CESI</a></h1>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="burger" aria-label="Ouvrir le menu">☰</label>

        <nav class="menu" aria-label="Navigation principale">
            <a href="#">Accueil</a>
            <a href="#" class="active">Mes taches</a>
            <a href="#">A propos</a>
        </nav>
    </header>
    <main>
        <h2>Ma liste de tâches</h2>
        <p>Interface cliente d'une API Node.js / MySQL</p>

        <span id="connection" role="status"> <i class="fa-solid fa-circle" ></i> Connexion temps réel…</span>

        <form id="task-form" novalidate>
            <label for="title">Nouvelle tâche</label>
            <input id="title" name="title" required minlength="2" maxlength="120" placeholder="Ex. Terminer le TP">
            <button type="submit">Ajouter</button>
        </form>

        <div class="toolbar">
            <label for="filter">Afficher</label>
            <select id="filter">
                <option value="all">Toutes</option>
                <option value="todo">A faire</option>
                <option value="done">Terminees</option>
            </select>

            <button class="secondary" id="refresh" type="button">Actualiser</button>
            <a href="#" class="active">Mes tâches<span id="compteur" class="compteur"> 0</span></a>
        </div>
        


        <p id="message" role="alert"></p>

        <ul id="tasks" aria-live="polite"></ul>

        <p id="empty" hidden>Aucune tâche à afficher.</p>
    </main>
    
    <footr></footr>

    <script src="app.js" defer></script> 
</body>
</html>
